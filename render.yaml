# InsightAI on Render (free web services).
# Dashboard: https://dashboard.render.com → New → Blueprint → this repo
#
# Use native Python runtime (not Docker) - more reliable on free tier.
# After deploy, open the insightai-ui service URL.

services:
  - type: web
    name: insightai-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: AUTH_ENABLED
        value: "false"
      - key: REQUIRE_AUTH_IN_PRODUCTION
        value: "false"
      - key: CONFIDENCE_THRESHOLD
        value: "0.32"
      - key: CONFIDENCE_MARGIN
        value: "0.10"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:////tmp/insight.db
      - key: UPLOAD_DIR
        value: /tmp/uploads

  - type: web
    name: insightai-ui
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --browser.gatherUsageStats false --server.headless true"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Public HTTPS URL - private host:port often fails between free services.
      - key: API_BASE_URL
        value: https://insightai-api.onrender.com
      - key: API_TIMEOUT_SECONDS
        value: "60"
      - key: API_READY_TIMEOUT_SECONDS
        value: "90"
