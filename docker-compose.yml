services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./insight.db
      CONFIDENCE_THRESHOLD: "0.6"
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
