services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Demo-friendly defaults. For shared/staging set AUTH_ENABLED=true + API_KEY.
      DATABASE_URL: sqlite:////data/insight.db
      CONFIDENCE_THRESHOLD: "0.32"
      CONFIDENCE_MARGIN: "0.10"
      ENVIRONMENT: development
      AUTH_ENABLED: "false"
      REQUIRE_AUTH_IN_PRODUCTION: "false"
      CORS_ORIGINS: "http://localhost:8501,http://127.0.0.1:8501,http://localhost:8502,http://127.0.0.1:8502"
      UPLOAD_DIR: /data/uploads
    volumes:
      # Persist DB + uploads. Do NOT mount ./ml/artifacts - that path is gitignored
      # and an empty host dir would wipe the model baked into the image at build time.
      - insightai_data:/data
    healthcheck:
      # Use /health (not /ready) - first model load can take minutes and would
      # block compose depends_on if the probe hit /ready.
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health'); assert json.load(r).get('status')=='ok'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      API_TIMEOUT_SECONDS: "30"
      API_KEY: ${API_KEY:-}
    depends_on:
      - api

volumes:
  insightai_data:
